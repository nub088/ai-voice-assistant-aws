app = "clearslope-receptionist"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  BACKEND_PORT = "8080"
  LOG_LEVEL = "INFO"

[processes]
  app = "/app/entrypoint.sh app"
  retention = "/app/entrypoint.sh retention"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  # SC7: recycle a wedged process. /healthz already returns 503 when a required
  # dependency (Anthropic/Deepgram/Cartesia/Twilio sig/Sheets/voicemail secret)
  # is missing, so this also flags a broken deploy instead of serving a dead app.
  # grace_period covers the ~10s synchronous Pipecat model warm-up at startup.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "transcripts_data"
  destination = "/data"
  initial_size = "1gb"
  processes = ["app"]

[[vm]]
  processes = ["app"]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  processes = ["retention"]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  schedule = "daily"
